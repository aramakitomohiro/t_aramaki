#=========================
#mailsettings.ini
#外接メール送信_設定用外部定義ファイル
#背景:2026年のOA更改に伴い、外接系でのRPA実行が困難となったことにより作成
#目的:外部へのメール送信処理を行うための設定を記載します
#起動契機:
# - ScriptA_β.ps1起動時
#=========================

[General]
# 送信前の最終確認ダイアログを出すか（true/false）
# Confirm=true
# 必要であれば以下にCCを追加
# Cc=
# 要件：Bccは以下で一律
# "テストのため以下のメールアドレスはダミーです"
Bcc=gpa@kain.co.jp

# 文字コード（プリザンターのCSVがUTF-8想定）
CsvEncoding=UTF8

[Paths]
# ユーザーがCSVを置く領域（スクリプトAの読み取り元／結果返却先）
"UserArea=\\fileshare\mail\UserArea"
# 送信処理を行う領域（JP1から監視／スクリプトBの作業場所）
"ProcessingArea=\\fileshare\mail\ProcessingArea"
# ログ格納先（両スクリプト共通）
"LogDir=\\fileshare\mail\Logs"
# アーカイブ（処理済みCSVの保管先）
"ArchiveDir=\\fileshare\mail\Archive"

[SMTP]
# Exchangeの受信コネクタ（m-FILTERへリレー）
# 要件:実行によるメール送信経路については、Exchange ServerをSMTPサーバとして指定し、m-FILTERへSMTPリレーすることでメールフィルタリング機能を用いる
# ExchangeServer2016_パラメータシート参照(ExchangeサーバのOAセグメントを指定)
# "テストのためlocalhostにしているが、実際はExchangeサーバのホスト名を指定すること"
Server=localhost
# 「SMTP サーバ機能」を有効にし、待ち受けポート番号は、現行のメールサーバと同様「25/TCP」とする。
Port=25
# SSLとAuth値が不明のため再度確認が必要
# EnableSsl=false
# Auth=false

# 送信元は一律固定（要件）
# "テストのため以下のメールアドレスはダミーです"
From=k-app@kain.co.jp

# ---------- ファイル種別ごとのテンプレ ----------
# ファイル名にこの語が含まれたらこのテンプレを使用
[KOZA_KAISETSU]
CsvKeyword=口座開設_メール送信時に使用
Subject=【口座開設】お手続きの結果について
Body=いつもご利用ありがとうございます@CRLF@CRLFお手続きが完了いたしました@CRLF本メールは自動送信です

[GAKKO_JIFU]
CsvKeyword=学校自振_メール送信時に使用
Subject=【学校自振】手続き結果のご連絡
Body=学校自振の登録が完了いたしました@CRLFご確認をお願いします

[TODOKE_HENKO]
CsvKeyword=届出事項変更_メール送信時に使用
Subject=【届出事項変更】手続きのご連絡
Body=届出事項変更のお手続きが完了いたしました@CRLF本メールは自動送信です

# ---------- CSV列の論理名マッピング ----------
[Columns]
# 1列目に送信日を書き戻す（空なら未送信扱い）
Col1=MailSentDate
Col2=MailAddress
Col3=Subject1
Col4=Body1